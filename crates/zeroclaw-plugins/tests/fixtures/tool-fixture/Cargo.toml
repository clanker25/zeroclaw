[package]
name = "zeroclaw-tool-plugin-fixture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = true

[lib]
crate-type = ["cdylib"]
doc = false
doctest = true
test = false

[features]
namespace-tool-search = []
namespace-mcp-tool = []
namespace-peripheral-tool = []
namespace-skill-tool = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51"
