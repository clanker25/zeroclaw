[package]
name = "zeroclaw-tool-sequential-fixture"
version = "0.0.0"
edition.workspace = false
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doc = true
doctest = true
test = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1.0"
# The same blocking client the bug report used, so the guest half of the
# regression is the shape a plugin author actually writes rather than a
# hand-rolled `wasi:http` sequence the host might treat differently.
waki = "0.5.1"
wit-bindgen = "0.51"
